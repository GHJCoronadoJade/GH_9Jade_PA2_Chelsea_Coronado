<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<title>Tables and Images with Bootstrap</title>


</head>
<body>
    <h2 class="text-center">Naruto Characters - Team 7</h2>
    <div class="row">
        <img class="rounded mx-auto d-block col-lg-4" src="https://i.redd.it/efgzdey00y9f1.jpg" alt="Uchiha Sasuke" height="300px" width="450px">
        <img class="rounded-circle mx-auto d-block col-lg-4" src="https://illestpaper.com/wp-content/uploads/sites/36/2022/06/sakura-haruno-green-clouds-wallpaper-illestpaper.jpg" alt="Sakura" height="300px" width="450px">
        <img class="img-thumbnail mx-auto d-block col-lg-4" src="https://wallpaperaccess.com/full/3540535.png" alt="Uzumaki Naruto" height="300px" width="450px">
    </div>
    <h1 class= text-center>Bootstrap Table</h1>
    <img class="mx-auto d-block" src="https://upload.wikimedia.org/wikipedia/en/2/21/Web_of_Spider-Man_Vol_1_129-1.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="spiderman" height="350px" width="250px">
    <table class="table table-boredered table-hover table-striped container">
        <tr>
            <th class="bg-primary" scope="col">Name</th>
            <th class="bg-primary" scope="col">Favortie anime</th>
            <th class="bg-primary" scope="col">Protagonist</th>
        </tr>
        <tr>
            <td>Chelsea Coronado</td>
            <td>Spy x Family</td>
            <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCpXwJvCbhaZvPmcyA08fAOvtFESEKZ-26r-EjBvQjjdMa78oAm2ilK_k&s=10" height="150px" weight="200px"></td>
        </tr>

        <tr>
            <td>Sofia Navarro</td>
            <td>JJK</td>
            <td><img src="https://www.looper.com/img/gallery/jujutsu-kaisen-what-happens-if-inumaki-talks-too-much/intro-1693331119.jpg" height="150px" weight="200px"></td>
        </tr>

        <tr>
            <td>Jandi Galvez</td>
            <td>Apothecary Diaries</td>
            <td><img src="https://static0.cbrimages.com/wordpress/wp-content/uploads/2023/12/the-apothecary-diaries-maomao-2.jpg" height="150px" weight="200px"></td>
        </tr>

        <tr>
            <td>Yazni Medina</td>
            <td>Demon Slayer</td>
            <td><img src="https://static0.cbrimages.com/wordpress/wp-content/uploads/2024/06/kamado-tanjiro.jpg?w=1200&h=900&fit=crop" height="150px" weight="200px"></td>
        </tr>

        <tr>
            <td>Salve Ala</td>
            <td>JJK</td>
            <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSKZIV_d53A7YrZlkwCdTmDVdOwDWNHgj7s933AFjkjUMn85Dg1vLM8N5Q&s=10" height="150px" weight="200px"></td>
        </tr>
    </table>
</body>
</html>
